name: Build and push release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dcarbone/install-jq-action@v2
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_SECRET_KEY }}

      - name: For push get current rust app version from its Cargo.toml.
        id: app_version
        run: echo "TAG=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "controller") | .version')" >> $GITHUB_OUTPUT

      - name: Use that version to do something funny.
        shell: bash
        run: echo "Current app version is ${{ steps.app_version.outputs.TAG }}"

      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.app_version.outputs.TAG }}',
              sha: context.sha
            })

      - name: Building & Pushing Docker Image
        run: |
          docker build . -f Containerfile --tag quay.io/gevulot/gevulot-operator:${{ steps.app_version.outputs.TAG }} --tag quay.io/gevulot/gevulot-operator:latest
          docker push quay.io/gevulot/gevulot-operator:${{ steps.app_version.outputs.TAG }}
