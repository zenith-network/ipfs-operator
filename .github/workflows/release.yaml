name: Build and push release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Unset by default; enable only after Quay credentials and repositories are configured.
    if: vars.QUAY_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dcarbone/install-jq-action@v2
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_SECRET_KEY }}

      - name: Get operator version
        id: app_version
        run: echo "TAG=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "ipfs-operator") | .version')" >> "$GITHUB_OUTPUT"

      - name: Build container images
        env:
          TAG: ${{ steps.app_version.outputs.TAG }}
        run: |
          docker build . -f Containerfile --target ipfs-operator --tag "quay.io/gevulot/ipfs-operator:$TAG" --tag quay.io/gevulot/ipfs-operator:latest
          docker build . -f Containerfile --target bootstrap-web --tag "quay.io/gevulot/bootstrap-web:$TAG" --tag quay.io/gevulot/bootstrap-web:latest

      - name: Push container images
        env:
          TAG: ${{ steps.app_version.outputs.TAG }}
        run: |
          docker push "quay.io/gevulot/ipfs-operator:$TAG"
          docker push quay.io/gevulot/ipfs-operator:latest
          docker push "quay.io/gevulot/bootstrap-web:$TAG"
          docker push quay.io/gevulot/bootstrap-web:latest

      - name: Create tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.app_version.outputs.TAG }}
        with:
          script: |
            const ref = `tags/v${process.env.VERSION}`;
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha
              });
            }
