[workspace]
members = [
    "crates/operator-common",
    "crates/operator",
    "crates/bootstrap-web",
]
exclude = []
resolver = "2"

[workspace.dependencies]
operator-common = { path = "crates/operator-common" }
actix-web = "4.4.0"
futures = "0.3.28"
tokio = { version = "1.32.0", default-features = false }
k8s-openapi = { version = "0.21.1", default-features = false }
schemars = { version = "0.8.12", default-features = false }
serde = { version = "1.0.185", default-features = false }
serde_json = "1.0.105"
serde_yaml = "0.9.25"
prometheus = "0.13.3"
chrono = { version = "0.4.26", default-features = false }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", default-features = false }
tracing-opentelemetry = "0.20.0"
opentelemetry = { version = "0.20.0", default-features = false }
opentelemetry-otlp = { version = "0.13.0", default-features = false }
tonic = "0.9"
thiserror = "1.0.47"
anyhow = "1.0.75"
kube-runtime = "0.90.0"
kube = { version = "0.90.0", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
libp2p = "0.56.0"
rand = "0.8.5"
libp2p-identity = { version = "0.2.13", default-features = false }
base64 = "0.22.1"
hex = "0.4.2"
actix-web-httpauth = "0.8.2"

# dev-dependencies
assert-json-diff = "2.0.2"
http = "1"
hyper = "1"
tower-test = "0.4.0"
