apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "web.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: eg
  hostnames:
    - "bootstrap.zenith.network"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "web.fullname" . }}
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
